
windowrule {
    name = "Calendar Always Floating"
    match:class = org.gnome.Calendar
    float = on
    size = 360 600
    move = (monitor_w/2)-(360/2) 35
}

windowrule {
    name = "Firefox History Always Floating"
    match:class = firefox
    match:title = Library
    float = on
    size = 974 697
    move = (monitor_w/2)-(974/2) (monitor_h/2)-(697/2)
}
