# Application bindings
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER, E, File manager, exec, uwsm-app -- thunar
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus ^signal$ "uwsm-app -- signal-desktop"

# Add extra bindings
# bind = SUPER SHIFT, R, exec, alacritty -e ssh your-server
bind = SUPER, page_up, workspace, -1
bind = SUPER, bracketleft, workspace, -1
bind = SUPER, page_down, workspace, +1
bind = SUPER, bracketright, workspace, +1
bind = SUPER SHIFT, page_up, movetoworkspace, -1
bind = SUPER SHIFT, bracketleft, movetoworkspace, -1
bind = SUPER SHIFT, page_down, movetoworkspace, +1
bind = SUPER SHIFT, bracketright, movetoworkspace, +1
unbind = SUPER, M
bind = SUPER, M, exec, ~/.config/hypr/scripts/swap-monocle-master-layouts.sh

# Overwrite existing bindings
unbind = SUPER, T
unbind = SUPER, W
unbind = SUPER SHIFT, W
unbind = SUPER, V
unbind = SUPER CTRL, V
unbind = SUPER, SPACE
unbind = SUPER, F
unbind = SUPER SHIFT, F
bindd = SUPER, T, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bind = SUPER, Q, killactive
bindr = SUPER, SUPER_L, exec, walker
bindd = SUPER, V, Clipboard manager, exec, omarchy-launch-walker -m clipboard
bindd = SUPER CTRL, V, Universal paste, sendshortcut, SHIFT, Insert,
bindd = SUPER, W, Show key bindings, exec, omarchy-menu-keybindings
bindd = SUPER, F, Toggle window floating/tiling, togglefloating,

# Vim motions for hyprland
unbind = SUPER, H
unbind = SUPER, J
unbind = SUPER, K
unbind = SUPER, L
bind = SUPER, H, movefocus, l
bind = SUPER, J, movefocus, d
bind = SUPER, K, movefocus, u
bind = SUPER, L, movefocus, r
unbind = SUPER SHIFT, H
unbind = SUPER SHIFT, J
unbind = SUPER SHIFT, K
unbind = SUPER SHIFT, L
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, J, movewindow, d
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, L, movewindow, r

# Monitor Brightness
bind = , XF86MonBrightnessUp, exec, ddcutil setvcp 10 + 30
bind = , XF86MonBrightnessDown, exec, ddcutil setvcp 10 - 30

